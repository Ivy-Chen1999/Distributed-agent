name: v1.0-cost-api
description: >
  api twin of v1.0-cost (= v1.0-unscoped-api plus the cost step): same prompts, cost prompt,
  router and retrieval caps, every role on the api backend with v0.3-api's models and reasoning
  effort, role for role. Formal cost sweeps and the IA cost check run on this twin; claude_code
  results are dev-only.
planner:
  backend: api
  model: openai:gpt-6.1-sol
  reasoning_effort: medium
  prompt: prompts/planner.md
  explore_prompt: prompts/v1/planner_explore.md
synthesis:
  backend: api
  model: openai:gpt-6.1-sol
  reasoning_effort: medium
  prompt: prompts/v0.3/synthesis.md
  timeout_s: 480
judge:
  backend: api
  model: openai:gpt-6.1-sol
  reasoning_effort: medium
  prompt: prompts/judge_coverage_v2.md
experts:
  - id: legal
    domain: legal
    role: {backend: api, model: openai:gpt-6.1-sol, reasoning_effort: medium, prompt: prompts/v0.3/legal.md, timeout_s: 480}
  - id: fiscal
    domain: fiscal
    role: {backend: api, model: openai:gpt-6.1-sol, reasoning_effort: medium, prompt: prompts/v0.3/fiscal.md, timeout_s: 480}
  - id: stakeholder
    domain: stakeholder
    role: {backend: api, model: openai:gpt-6.1-sol, reasoning_effort: medium, prompt: prompts/v0.3/stakeholder.md, timeout_s: 480}
router:
  mode: shadow
  decider: stub
max_parallel_llm_calls: 3
retrieval:
  max_provisions: 8
  max_prompt_chars: 60000
cost:
  backend: api
  model: openai:gpt-6.1-sol
  reasoning_effort: medium
  prompt: prompts/v1/cost.md
  timeout_s: 480
  max_records_per_call: 60
