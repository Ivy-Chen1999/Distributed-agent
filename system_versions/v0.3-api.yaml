name: v0.3-api
description: >
  Deployment twin of the promoted v0.3-candidate: same prompts, timeouts and router, every role on
  the api backend. Models pinned 2026-10-14 to OpenAI's snapshot ids (GPT-6 has no dated ids):
  gpt-6-luna for the Planner, gpt-6.1-sol for every other role, reasoning effort medium. The
  judge's model and effort must not change after calibration.
planner:
  backend: api
  model: openai:gpt-6-luna
  reasoning_effort: medium
  prompt: prompts/planner.md
synthesis:
  backend: api
  model: openai:gpt-6.1-sol
  reasoning_effort: medium
  prompt: prompts/v0.3/synthesis.md
  timeout_s: 480
judge:
  backend: api
  model: openai:gpt-6.1-sol
  reasoning_effort: medium
  prompt: prompts/judge_coverage.md
experts:
  - id: legal
    domain: legal
    role: {backend: api, model: openai:gpt-6.1-sol, reasoning_effort: medium, prompt: prompts/v0.3/legal.md, timeout_s: 480}
  - id: fiscal
    domain: fiscal
    role: {backend: api, model: openai:gpt-6.1-sol, reasoning_effort: medium, prompt: prompts/v0.3/fiscal.md, timeout_s: 480}
  - id: stakeholder
    domain: stakeholder
    role: {backend: api, model: openai:gpt-6.1-sol, reasoning_effort: medium, prompt: prompts/v0.3/stakeholder.md, timeout_s: 480}
router:
  mode: shadow
  decider: stub
max_parallel_llm_calls: 3
