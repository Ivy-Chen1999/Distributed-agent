name: v0.3-api
description: >
  Deployment twin of the promoted v0.3-candidate: same prompts, timeouts and router, every role on
  the api backend. Model ids are unverified until the first live run with an API key.
planner:
  backend: api
  model: openai:gpt-5.6-terra
  prompt: prompts/planner.md
synthesis:
  backend: api
  model: openai:gpt-5.6-terra
  prompt: prompts/v0.3/synthesis.md
  timeout_s: 480
judge:
  backend: api
  model: openai:gpt-5.6-terra
  prompt: prompts/judge_coverage.md
experts:
  - id: legal
    domain: legal
    role: {backend: api, model: openai:gpt-5.6-terra, prompt: prompts/v0.3/legal.md, timeout_s: 480}
  - id: fiscal
    domain: fiscal
    role: {backend: api, model: openai:gpt-5.6-terra, prompt: prompts/v0.3/fiscal.md, timeout_s: 480}
  - id: stakeholder
    domain: stakeholder
    role: {backend: api, model: openai:gpt-5.6-terra, prompt: prompts/v0.3/stakeholder.md, timeout_s: 480}
router:
  mode: shadow
  decider: stub
max_parallel_llm_calls: 3
