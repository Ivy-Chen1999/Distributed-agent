name: v1.0-scoped-api
description: >
  api twin of v1.0-scoped: same prompts, explore prompt, data scopes, router and retrieval caps,
  every role on the api backend with v0.3-api's model id. The pre-registered scoped vs unscoped
  comparison runs on this twin and v1.0-unscoped-api. Model ids are unverified until the first
  live run with an API key.
planner:
  backend: api
  model: openai:gpt-5.6-terra
  prompt: prompts/planner.md
  explore_prompt: prompts/v1/planner_explore.md
synthesis:
  backend: api
  model: openai:gpt-5.6-terra
  prompt: prompts/v0.3/synthesis.md
  timeout_s: 480
judge:
  backend: api
  model: openai:gpt-5.6-terra
  prompt: prompts/judge_coverage.md
experts:
  - id: legal
    domain: legal
    role: {backend: api, model: openai:gpt-5.6-terra, prompt: prompts/v0.3/legal.md, timeout_s: 480}
    scope:
      text: all
      obligations: full
      sees_delta: false
      sees_memorandum: true
      hypothesis: Legal interpretation needs the full text and the legislator's explanation.
  - id: fiscal
    domain: fiscal
    role: {backend: api, model: openai:gpt-5.6-terra, prompt: prompts/v0.3/fiscal.md, timeout_s: 480}
    scope:
      text: []
      obligations: full
      sees_delta: false
      sees_memorandum: false
      hypothesis: Cost claims stay traceable to specific obligation records.
  - id: stakeholder
    domain: stakeholder
    role: {backend: api, model: openai:gpt-5.6-terra, prompt: prompts/v0.3/stakeholder.md, timeout_s: 480}
    scope:
      # Subject matter, scope, definitions, high-risk classification and Annex III (both versions).
      text:
        - ai_act/art/1
        - ai_act/art/2
        - ai_act/art/3
        - ai_act/art/6
        - ai_act/annex/III
      obligations: actors
      sees_delta: false
      sees_memorandum: false
      hypothesis: >
        Who is affected is judged without being steered by what the duties are. Weakened for
        records whose primary actor is unspecified, which show their verbatim span until actor
        completion lands.
router:
  mode: shadow
  decider: stub
max_parallel_llm_calls: 3
retrieval:
  max_provisions: 8
  max_prompt_chars: 60000
