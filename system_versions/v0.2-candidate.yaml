name: v0.2-candidate
description: >
  Candidate over v0-baseline: experts follow a systematic direct / second-order / net-effect
  checklist and report each mechanism separately; synthesis merges only same actor + same
  mechanism. Planner and judge prompts are unchanged so scores stay comparable.
planner:
  backend: claude_code
  model: claude-sonnet-5
  prompt: prompts/planner.md
synthesis:
  backend: claude_code
  model: claude-sonnet-5
  prompt: prompts/v0.2/synthesis.md
judge:
  backend: claude_code
  model: claude-sonnet-5
  prompt: prompts/judge_coverage.md
experts:
  - id: legal
    domain: legal
    role: {backend: claude_code, model: claude-sonnet-5, prompt: prompts/v0.2/legal.md}
  - id: fiscal
    domain: fiscal
    role: {backend: claude_code, model: claude-sonnet-5, prompt: prompts/v0.2/fiscal.md}
  - id: stakeholder
    domain: stakeholder
    role: {backend: claude_code, model: claude-sonnet-5, prompt: prompts/v0.2/stakeholder.md}
router:
  mode: shadow
  decider: stub
max_parallel_llm_calls: 3
