name: v0-baseline
description: >
  Friday smoke baseline. All roles on the local Claude Code subscription (isolated CLI).
  Router in shadow mode with the stub decider.
planner:
  backend: claude_code
  model: claude-sonnet-5
  prompt: prompts/planner.md
synthesis:
  backend: claude_code
  model: claude-sonnet-5
  prompt: prompts/synthesis.md
judge:
  backend: claude_code
  model: claude-sonnet-5
  prompt: prompts/judge_coverage.md
experts:
  - id: legal
    domain: legal
    role: {backend: claude_code, model: claude-sonnet-5, prompt: prompts/legal.md}
  - id: fiscal
    domain: fiscal
    role: {backend: claude_code, model: claude-sonnet-5, prompt: prompts/fiscal.md}
  - id: stakeholder
    domain: stakeholder
    role: {backend: claude_code, model: claude-sonnet-5, prompt: prompts/stakeholder.md}
router:
  mode: shadow
  decider: stub
max_parallel_llm_calls: 3
