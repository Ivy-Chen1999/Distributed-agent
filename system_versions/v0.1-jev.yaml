name: v0.1-jev
description: >
  v0-baseline with the router's shadow decisions made by TypeSafe Jev (one Noul question per
  expert). Requires TYPESAFE_API_KEY. Shadow mode: every expert still runs.
planner:
  backend: claude_code
  model: claude-sonnet-5
  prompt: prompts/planner.md
synthesis:
  backend: claude_code
  model: claude-sonnet-5
  prompt: prompts/synthesis.md
judge:
  backend: claude_code
  model: claude-sonnet-5
  prompt: prompts/judge_coverage.md
experts:
  - id: legal
    domain: legal
    role: {backend: claude_code, model: claude-sonnet-5, prompt: prompts/legal.md}
  - id: fiscal
    domain: fiscal
    role: {backend: claude_code, model: claude-sonnet-5, prompt: prompts/fiscal.md}
  - id: stakeholder
    domain: stakeholder
    role: {backend: claude_code, model: claude-sonnet-5, prompt: prompts/stakeholder.md}
router:
  mode: shadow
  decider: jev
max_parallel_llm_calls: 3
