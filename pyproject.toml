[project]
name = "womm"
version = "0.1.0"
description = "WOMM: self-evolving multi-agent Regulatory Impact Assessment (v0 skeleton)"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "langgraph>=1.2,<2",
    "langchain>=1.1,<2",
    "langchain-core>=1.6,<2",
    "langchain-openai>=1.0,<2",
    "langsmith>=0.14,<1",
    "pydantic>=2.13,<3",
    "pyyaml>=6",
    "httpx>=0.28",
    "lxml>=5",
    "fastapi>=0.141",
    "uvicorn>=0.35",
    "python-dotenv>=1.2.3",
]

[project.scripts]
womm = "womm.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.0",
    "ruff>=0.13",
    "langgraph-cli[inmem]>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/womm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: calls real external services (claude CLI, LLM APIs); run with -m live",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"]
