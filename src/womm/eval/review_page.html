<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23141414'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11' fill='none' stroke='%23FFB000' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Labelling Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* The owner's local review of a scored labelling round. Same shell as the labelling page.
   It holds the tool's or judge's decisions: it is written next to key.private.json and is
   never uploaded or sent. */
:root { --ink: #0F0F0F; --bg: #FDFCFD; --paper: #fff; --bark: #C4B8AB; --bark-lt: #E1DCD7;
  --green: #007A5E; --green-lt: #e3f3ee; --amber: #FFB000; --amber-lt: #fff3d1; --red: #A01414;
  --red-lt: #f8e3e3; --grey: #505A5F; --muted: #6b6b6b; --mark: #ffe08a; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.55 "Manrope", -apple-system, "Segoe UI", Roboto, sans-serif; }
[hidden] { display: none !important; }
.topbar { height: 60px; display: flex; align-items: center; gap: 16px; padding: 0 32px;
  background: var(--ink); color: var(--bg); position: sticky; top: 0; z-index: 5; }
.topbar .title { font-weight: 700; } .topbar .sub { color: var(--bark); font-size: 14px; }
.topbar .spacer { flex: 1; }
.private { font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
  color: var(--amber); border: 1px solid var(--amber); border-radius: 4px; padding: 3px 8px; }
main { max-width: 1080px; margin: 0 auto; padding: 28px 24px 80px; display: flex;
  flex-direction: column; gap: 22px; }
.verdict { border-radius: 8px; padding: 22px 26px; display: flex; flex-direction: column; gap: 8px; }
.verdict.pass { background: var(--green-lt); border: 2px solid var(--green); }
.verdict.fail { background: var(--red-lt); border: 2px solid var(--red); }
.verdict.wait { background: var(--amber-lt); border: 2px solid var(--amber); }
.verdict .tag { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.verdict.pass .tag { color: var(--green); } .verdict.fail .tag { color: var(--red); }
.verdict.wait .tag { color: #8a6400; }
.verdict h1 { margin: 0; font-size: 24px; line-height: 1.3; }
.verdict p { margin: 0; color: var(--grey); }
.verdict ol { margin: 4px 0 0; padding-left: 20px; } .verdict li { margin-bottom: 4px; }
.verdict code, .numbers code { font-family: ui-monospace, Menlo, monospace; font-size: 13px;
  background: rgba(0,0,0,.06); padding: 1px 5px; border-radius: 3px; }
h2 { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; margin: 0; }
.numbers { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.num { border: 1px solid var(--bark); border-radius: 6px; padding: 14px 16px; display: flex;
  flex-direction: column; gap: 4px; }
.num .v { font-size: 26px; font-weight: 700; line-height: 1.1; }
.num .v.good { color: var(--green); } .num .v.bad { color: var(--red); }
.num .l { font-size: 13px; font-weight: 700; }
.num .e { font-size: 13px; color: var(--grey); line-height: 1.45; }
.section-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.section-head .hint { font-size: 14px; color: var(--grey); }
.tally { font-size: 13px; color: var(--grey); margin-left: auto; }
.item { border: 1px solid var(--bark); border-radius: 8px; overflow: hidden; background: var(--paper); }
.item-head { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 12px 18px;
  background: var(--bark-lt); font-size: 13px; }
.item-head b { font-size: 14px; }
.chip { border: 1px solid var(--grey); border-radius: 4px; padding: 1px 7px; font-size: 12px;
  font-weight: 700; color: var(--grey); }
.item-body { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
.col { padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.col + .col { border-left: 1px solid var(--bark-lt); }
.lbl { font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
  color: var(--grey); }
dl { margin: 0; display: flex; flex-direction: column; gap: 6px; }
dt { font-size: 12px; font-weight: 700; color: var(--grey); }
dd { margin: 0; font-size: 14px; }
.passage { font-family: Georgia, serif; font-size: 15px; line-height: 1.6; color: #2a2a2a;
  max-height: 260px; overflow: auto; overflow-wrap: anywhere; }
.passage mark { background: var(--mark); padding: 1px 2px; }
.dossier { max-height: 300px; overflow: auto; font-size: 13px; display: flex; flex-direction: column; gap: 8px; }
.dossier div { border-left: 3px solid var(--bark); padding-left: 10px; }
.dossier div.matched { border-left-color: var(--ink); background: var(--amber-lt); }
.verdicts { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--bark-lt); }
.who { padding: 14px 18px; display: flex; flex-direction: column; gap: 6px; }
.who + .who { border-left: 1px solid var(--bark-lt); }
.ans { font-weight: 700; } .ans.yes { color: var(--green); } .ans.no { color: var(--red); }
.ans.unsure { color: #8a6400; }
.why { font-size: 14px; color: var(--grey); }
.decide { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 12px 18px;
  border-top: 1px solid var(--bark-lt); background: var(--bg); }
.decide span { font-size: 13px; font-weight: 700; margin-right: 4px; }
.decide button { height: 34px; padding: 0 12px; border: 1px solid var(--ink); border-radius: 4px;
  background: var(--bg); font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; }
.decide button.on { background: var(--ink); color: var(--bg); }
.empty { color: var(--grey); font-size: 14px; border: 1px dashed var(--bark); border-radius: 6px;
  padding: 16px; }
@media (max-width: 760px) {
  .item-body, .verdicts { grid-template-columns: 1fr; }
  .col + .col, .who + .who { border-left: none; border-top: 1px solid var(--bark-lt); }
  .topbar { padding: 0 16px; } main { padding: 20px 16px 60px; }
}
</style>
</head>
<body>
<header class="topbar"><span class="title" id="title"></span><span class="sub" id="sub"></span>
  <span class="spacer"></span><span class="private">Private: stays on your machine</span></header>
<main>
  <section class="verdict" id="verdict"></section>
  <section><div class="numbers" id="numbers"></div></section>
  <section id="disagreeSec">
    <div class="section-head"><h2>Where people and the AI disagree</h2>
      <span class="hint">Decide who is right for each; the advice above updates.</span>
      <span class="tally" id="tally"></span></div>
    <div id="disagree" style="display:flex;flex-direction:column;gap:14px;margin-top:12px"></div>
  </section>
  <section id="unsureSec">
    <div class="section-head"><h2>Marked "can't tell"</h2>
      <span class="hint">Often a sign the item or the rule is unclear.</span></div>
    <div id="unsure" style="display:flex;flex-direction:column;gap:14px;margin-top:12px"></div>
  </section>
</main>
<script>
const DATA = __DATA__;
const $ = id => document.getElementById(id);
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const KEY = "womm-review:" + DATA.sample;
let marks = {};
try { marks = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(marks)); } catch (e) {} };
const WORD = { keep: ["Keep", "yes"], drop: ["Drop", "no"], covered: ["Covered", "yes"],
  not_covered: ["Not covered", "no"], unsure: ["Can't tell", "unsure"] };
const NAMES = { affected_actor: "Who", mechanism: "What the law makes them do", impact: "What it means for them", description: "The point" };

function claimList(fields) {
  const dl = el("dl");
  for (const k of Object.keys(NAMES).filter(k => k in fields)) dl.append(el("dt", null, NAMES[k]), el("dd", null, fields[k]));
  return dl;
}

function card(c, withDecide) {
  const box = el("div", "item");
  const head = el("div", "item-head");
  head.append(el("b", null, c.id), el("span", null, c.case.replace(/^case_\d+_/, "").replace(/_/g, " ")));
  if (c.tag) head.append(el("span", "chip", c.tag));
  box.append(head);
  const body = el("div", "item-body");
  const left = el("div", "col"), right = el("div", "col");
  if (DATA.kind === "calibration") {
    left.append(el("span", "lbl", "Effect from the official report"), claimList(c.expected));
    right.append(el("span", "lbl", "What our AI wrote"));
    const d = el("div", "dossier");
    c.dossier.forEach((imp, j) => {
      const x = el("div", imp.impact_id === c.ai.matched ? "matched" : "");
      x.append(el("b", null, `${j + 1}. `), imp.summary);
      d.append(x);
    });
    if (!c.dossier.length) d.append(el("span", "why", "No entries."));
    right.append(d);
  } else {
    left.append(el("span", "lbl", "The point in the answer key"), claimList(c.claim));
    right.append(el("span", "lbl", c.source === "report" ? "The official report" : "The review board's opinion"),
      el("span", "why", "Section: " + (c.section_name || "")));
    const p = el("div", "passage");
    if (c.passage) p.append(c.passage.before, el("mark", null, c.passage.quote), c.passage.after);
    else p.append(el("mark", null, c.quote));
    right.append(p);
  }
  body.append(left, right); box.append(body);
  const v = el("div", "verdicts");
  const people = el("div", "who"); people.append(el("span", "lbl", c.people.length > 1 ? "The people" : "The person"));
  for (const h of c.people) {
    const line = el("div"); const w = WORD[h.label] || [h.label || "blank", ""];
    line.append(el("b", null, h.name + ": "), el("span", "ans " + w[1], w[0]));
    people.append(line);
    if (h.note) people.append(el("span", "why", "“" + h.note + "”"));
  }
  const ai = el("div", "who"); const w = WORD[c.ai.label] || [c.ai.label, ""];
  ai.append(el("span", "lbl", DATA.kind === "calibration" ? "The grader AI" : "The answer-key tool"),
    el("span", "ans " + w[1], w[0]), el("span", "why", c.ai.reason || "(no reason recorded)"));
  if (c.ai.matched) ai.append(el("span", "why", "It matched entry " + c.ai.matched + " (highlighted)."));
  v.append(people, ai); box.append(v);
  if (withDecide) {
    const dec = el("div", "decide"); dec.append(el("span", null, "Who is right?"));
    const opts = c.section === "unsure"
      ? [["people", "The AI is wrong"], ["ai", "The AI is right"], ["unclear", "Unclear / rule is vague"]]
      : [["people", "The people"], ["ai", "The AI"], ["unclear", "Unclear / rule is vague"]];
    for (const [k, t] of opts) {
      const b = el("button", marks[c.id] === k ? "on" : "", t);
      b.onclick = () => { marks[c.id] = marks[c.id] === k ? undefined : k; save(); render(); };
      dec.append(b);
    }
    box.append(dec);
  }
  return box;
}

function render() {
  $("title").textContent = DATA.title; $("sub").textContent = "sample " + DATA.sample;
  document.title = DATA.title;
  const v = DATA.verdict, sec = $("verdict");
  sec.className = "verdict " + v.state; sec.replaceChildren();
  sec.append(el("span", "tag", v.tag), el("h1", null, v.headline), el("p", null, v.meaning));
  const dis = DATA.cards.filter(c => c.section === "disagree");
  const all = DATA.cards;
  const t = { people: 0, ai: 0, unclear: 0 };
  all.forEach(c => { if (marks[c.id]) t[marks[c.id]]++; });
  let steps = [...v.next];
  const open = all.length - t.people - t.ai - t.unclear;
  const s = n => (n > 1 ? "s" : "");
  if (!all.length) {
    // nothing to judge
  } else if (open) {
    steps.unshift(`Mark who is right on the ${open} item${s(open)} below; this advice then says what to fix.`);
  } else if (t.people) {
    steps.unshift(`The AI was wrong on ${t.people}: look at what ${t.people > 1 ? "those share" : "it got wrong"} (its reasons are below) and fix that in its prompt.`);
    if (t.unclear) steps.push(`${t.unclear} were unclear: also sharpen the rule's wording on the labelling page.`);
  } else if (t.unclear) {
    steps = [`${t.unclear} item${s(t.unclear)} ${t.unclear > 1 ? "are" : "is"} unclear rather than wrong: sharpen the rule's wording on the labelling page, then ${v.state === "pass" ? "nothing else" : "run a new check with a new seed"}.`];
  } else if (v.state === "fail") {
    steps = ["You marked the AI right every time: the people slipped, and the prompts need no fix.",
             "The result still stands: it counts every disagreement, so a reviewer who has seen the AI's reasons cannot pass it. Run a new check with new items (a new seed) and point both people at the examples on the welcome card."];
  } else if (v.state === "pass") {
    steps.unshift("You marked the AI right every time: nothing to fix.");
  }
  const ol = el("ol"); for (const s of steps) { const li = el("li"); li.innerHTML = s; ol.append(li); }
  sec.append(ol);
  const nums = $("numbers"); nums.replaceChildren();
  for (const n of DATA.numbers) {
    const b = el("div", "num"); b.append(el("span", "v " + (n.good === true ? "good" : n.good === false ? "bad" : ""), n.value),
      el("span", "l", n.label)); const e = el("span", "e"); e.innerHTML = n.explain; b.append(e); nums.append(b);
  }
  $("tally").textContent = all.length ? `${t.ai} AI right · ${t.people} AI wrong · ${t.unclear} unclear · ${open} open` : "";
  const d = $("disagree"); d.replaceChildren(...dis.map(c => card(c, true)));
  if (!dis.length) d.append(el("div", "empty", "None: the people and the AI agree on every answered item."));
  const u = DATA.cards.filter(c => c.section === "unsure");
  $("unsureSec").hidden = !u.length;
  $("unsure").replaceChildren(...u.map(c => card(c, true)));
}
render();
</script>
</body>
</html>
