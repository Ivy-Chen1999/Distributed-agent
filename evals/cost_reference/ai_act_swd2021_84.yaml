# IA cost reference for the R6 cost check (EU cost plan U6). Scoring side only: never an agent
# input (tests/cost/test_ia_isolation.py). Read by womm.eval.cost_check alone.
reference_id: ai_act_swd2021_84
ia: SWD(2021) 84 final (impact assessment accompanying COM(2021) 206)
proposal_version: com2021_206
# One person checks every item against SWD(2021) 84 Part 1 §6.1.3, §6.2 and Part 2 Annex 3
# (Table 5) and Annex 4, then sets status: verified with name and date. The loader refuses an
# unverified file, so no scored check runs before that.
status: unverified
verified_by: null
verified_on: null
notes: >-
  Hand-written paraphrase of the IA with its figures, transcribed from the cached IA text on
  2026-10-07; no IA text is copied verbatim. Only the preferred option (3 / 3+) is used. All
  per-application figures are the IA's estimates for an average AI application assumed to cost
  about EUR 170 000 to develop (Standard Cost Model, EUR 32 per hour). Bands are computed by
  the loader from eur_low / eur_high (midpoint) with womm.cost.categories.BAND_EDGES_EUR; FTE
  figures use 1 FTE = EUR 32 x 1 720 hours. They are never typed here. Two internal
  inconsistencies are kept, not resolved: EU-level FTE (10 in §6.2, 5 in Annex 3 Table 5) and
  human oversight (EUR 7 764 in Table 8b, EUR 5 000-8 000 a year in the §6.1.3 text and Table
  5). Not quantified by the IA, so never counted against the system: prohibitions (Art 5),
  transparency for certain AI systems (Art 52), registration in the EU database (Art 51, 60),
  post-market monitoring and incident reporting (Art 61-62), importer, distributor and
  authorised-representative duties (Art 25-28), most user duties beyond oversight (Art 29),
  sandboxes and SME measures (Art 53-55), penalties (Art 71) and codes of conduct (Art 69).
  effort_types (recurring items only) is our reading of the kind of effort the IA prices, not
  IA text: human oversight is human_oversight, user documentation is documentation, the
  authorities' staff is new_process or assessment. payer_recurrence_agreement needs a matching
  record whose primary effort type is one of them.
