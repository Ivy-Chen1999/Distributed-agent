  affected_actor: authorised representatives and fulfilment service providers of non-EU manufacturers
  mechanism: Where the manufacturer is established outside the Union, the importer and authorised representative,
    and failing them the fulfilment service provider, can be held liable (Art. 7(2)–(3); definitions in
