expected_impacts:
- expected_id: c11_e01
  affected_actor: Software producers (including providers of standalone software and software updates)
  mechanism: Software is defined as a 'product' (Art. 4(1)), so its manufacturers become subject to no-fault
    liability under Art. 7, and the later-defect exemption does not apply to software and updates within
    the manufacturer's control (Art. 10(2))
  impact: Higher exposure to liability claims raises annual product liability insurance costs for software
    producers by 15%.
  provision_keys:
  - pld/proposal/art/4
  - pld/proposal/art/7
  - pld/proposal/art/10
  ia_section: 6.3. Policy option 1c – Inclusion of software in its own right, new types of damage and
    adaptations for circular economy
  category: compliance_cost
  provenance: llm_judged
- expected_id: c11_e02
  affected_actor: Software producers and people harmed by defective software (litigants)
  mechanism: Applying no-fault product liability to software (Art. 4(1), Art. 7) replaces fault-based
    claims, which shortens proceedings and also opens a new route for claims
  impact: Annual legal costs fall by 6% because proceedings are shorter, while the number of in-court
    and out-of-court cases rises by about 3.5%.
  provision_keys:
  - pld/proposal/art/4
  - pld/proposal/art/7
  ia_section: 6.3. Policy option 1c – Inclusion of software in its own right, new types of damage and
    adaptations for circular economy
  category: other
  provenance: llm_judged
- expected_id: c11_e03
  affected_actor: Manufacturers and other defendants in product liability cases
  mechanism: Courts may order defendants to disclose relevant evidence at their disposal when the claimant
    has made the claim plausible (Art. 8)
  impact: Limited extra burden, because nearly all Member States already have disclosure rules. Industry
    accepts harmonised rules provided requests are justified and intellectual property is protected.
  provision_keys:
  - pld/proposal/art/8
  ia_section: 6.4. Policy option 2.a – Easing the burden of proof and reducing disproportionate restrictions
    to make claims
  category: administrative_burden
  provenance: llm_judged
- expected_id: c11_e04
  affected_actor: Producers of complex products (pharmaceuticals, IoT and AI-enabled products)
  mechanism: Disclosure of evidence (Art. 8) and rebuttable presumptions of defectiveness and causation,
    including for technical or scientific complexity (Art. 9), make successful claims against them more
    likely
  impact: Annual product liability insurance costs rise by 4% for these producers.
  provision_keys:
  - pld/proposal/art/8
  - pld/proposal/art/9
  ia_section: 6.4. Policy option 2.a – Easing the burden of proof and reducing disproportionate restrictions
    to make claims
  category: compliance_cost
  provenance: llm_judged
- expected_id: c11_e05
  affected_actor: National courts and parties to litigation
  mechanism: Presumptions under Art. 9 and disclosure under Art. 8 put more of the onus on the producer,
    which knows the product best
  impact: Court cases become shorter. For complex products, legal costs fall by 10% while the number of
    proceedings rises by 5%. No particular impact on the justice system, as these tools are already familiar.
  provision_keys:
  - pld/proposal/art/8
  - pld/proposal/art/9
  ia_section: 6.4. Policy option 2.a – Easing the burden of proof and reducing disproportionate restrictions
