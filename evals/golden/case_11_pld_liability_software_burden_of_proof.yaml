  affected_actor: Injured persons (holders of the right to an effective remedy)
  mechanism: Easing the burden of proof through presumptions and disclosure for complex products (Arts.
    8–9)
  impact: Strengthens the right to an effective remedy under Article 47 of the EU Charter of Fundamental
