- expected_id: c11_e08
  affected_actor: Manufacturers that keep control over products after placing them on the market (e.g.
    robots, autonomous vehicles, software-updated products)
  mechanism: The later-defect exemption does not apply to defects from software, updates, missing safety
    updates or related services within the manufacturer's control (Art. 10(2)). The development-risk defence
    and the relevant moment for defectiveness extend to the period of control (Art. 10(1)(e), Art. 6(1)(e))
  impact: These manufacturers stay liable for defects that emerge after the product was put into circulation.
    The adapted development-risk defence adds no impact beyond this.
  provision_keys:
  - pld/proposal/art/10
  - pld/proposal/art/6
