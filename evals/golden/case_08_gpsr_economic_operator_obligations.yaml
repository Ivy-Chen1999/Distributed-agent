  LLM judges, open items settled by a tie-break judge. Human review by nobody (all items auto-accepted);
  published on 2026-10-19. Decisions: auto_accepted 8, verified 0, edited 0, llm_kept 7, rejected 0, unclear
  0, llm_dropped 3. Audit: 0/4 sampled items decided, 0 edited/rejected/unclear. Dropped by the tie-break
  judge: [''c08_o02'', ''c08_m04'', ''c08_m05'']. Corrected after a failed reference check (human feedback),
