  description: Public authorities bear enforcement costs to check declared performance and durability
    values, which may require laboratory testing of batteries.
  provision_keys:
  - batteries/proposal/art/10
  source: 'Impact assessment, Measure 7: Performance and durability of rechargeable industrial and EV
    batteries'
  category: public_enforcement_cost
  provenance: llm_judged
- omission_id: c09_o02
  description: Market surveillance authorities need additional resources to enforce the new recycled-content
    documentation obligation and targets.
  provision_keys:
  - batteries/proposal/art/8
  source: 'Impact assessment, Measure 9: Recycled content'
  category: public_enforcement_cost
  provenance: llm_judged
- omission_id: c09_o03
  description: Recycled-content targets may be hard to meet for large EV battery makers if there are not
    enough secondary raw materials, given fast-growing demand.
  provision_keys:
  - batteries/proposal/art/8
  source: 'Impact assessment, Measure 9: Recycled content'
  category: market_competition
  provenance: llm_tiebroken
- omission_id: c09_o04
  description: Maximum life-cycle carbon footprint thresholds work as a market-access restriction. If
    they are set badly, they could cause unintended supply restrictions for EV and industrial batteries
    on the EU market.
  provision_keys:
  - batteries/proposal/art/7
  source: 'Impact assessment, Measure 6: Carbon footprint of rechargeable industrial and EV batteries'
  category: market_competition
  provenance: llm_judged
