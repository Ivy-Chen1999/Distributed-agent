expected_impacts:
- expected_id: c09_e01
  affected_actor: Producers of EV batteries and rechargeable industrial batteries above 2 kWh
  mechanism: They must draw up a carbon footprint declaration in the technical documentation for each
    battery model and batch per plant, and have it verified by an independent third party.
  impact: One-off calculation costs of €100–5 000 per battery type, plus €2 000–7 000 per battery type
    for verification, with small follow-up costs. Assuming about 50 producers, the total cost to industry
    is €500 000–3 000 000.
  provision_keys:
  - batteries/proposal/art/7
  ia_section: 'Measure 6: Carbon footprint of rechargeable industrial and EV batteries'
  category: administrative_burden
  provenance: llm_judged
- expected_id: c09_e02
  affected_actor: Battery manufacturers (cell and battery production) and the electricity sector
  mechanism: Carbon footprint declarations, performance-class labels and maximum thresholds let the market
    tell batteries apart by carbon intensity, and push manufacturers to lower their production emissions.
  impact: Manufacturers are expected to switch to greener electricity providers or contracts, which helps
    decarbonise electricity generation. The IA expects this benefit to be larger with classes and thresholds,
    but it was not quantified.
  provision_keys:
  - batteries/proposal/art/7
  ia_section: 'Measure 6: Carbon footprint of rechargeable industrial and EV batteries'
  category: social_environmental
  provenance: llm_judged
- expected_id: c09_e03
  affected_actor: Producers of industrial, EV and automotive batteries containing cobalt, lead, lithium
    or nickel
  mechanism: From 2027 they must document the amount of recycled cobalt, lead, lithium and nickel in active
    materials for each battery model and batch, and have it calculated and verified.
  impact: Expected cost per battery type is about €2 100–12 000 (calculation €100–5 000 plus verification
    €2 000–7 000). For about 250 lithium-ion and 340 lead-acid battery types, the total one-off cost is
    €1 180 000–7 080 000.
  provision_keys:
  - batteries/proposal/art/8
  ia_section: 'Measure 9: Recycled content'
  category: administrative_burden
  provenance: llm_tiebroken
- expected_id: c09_e04
  affected_actor: Battery recyclers and investors in recycling technology
  mechanism: Mandatory minimum recycled-content shares for 2030 and 2035 create guaranteed future demand
    for battery-grade secondary cobalt, lithium, nickel and lead.
  impact: Recyclers get long-term investment certainty, which is a needed incentive to invest in recycling
    technologies. This helps the circular economy and reduces supply risk for certain materials.
  provision_keys:
  - batteries/proposal/art/8
  ia_section: 'Measure 9: Recycled content'
  category: innovation_investment
  provenance: llm_judged
- expected_id: c09_e05
  affected_actor: Society and the environment (climate, resources)
  mechanism: Recycled-content targets replace primary raw materials with secondary ones in battery active
    materials.
  impact: A cumulative saving of about 2.3 million tonnes of CO2-eq by 2035 compared with the baseline,
    with similar gains for resource depletion and human toxicity.
  provision_keys:
  - batteries/proposal/art/8
  ia_section: 'Measure 9: Recycled content'
  category: social_environmental
  provenance: llm_judged
- expected_id: c09_e06
  affected_actor: Manufacturers of rechargeable industrial batteries above 2 kWh
  mechanism: From 2026 batteries must meet minimum electrochemical performance and durability values to
    be placed on the market, which takes the worst performers off the market.
  impact: Manufacturers face some economic costs where they must adapt manufacturing processes and their
    choice of materials. Administrative costs are similar or slightly higher because compliance must be
    calculated and verified more strictly.
  provision_keys:
  - batteries/proposal/art/10
  ia_section: 'Measure 7: Performance and durability of rechargeable industrial and EV batteries'
  category: compliance_cost
  provenance: llm_judged
- expected_id: c09_e07
  affected_actor: Users and buyers of rechargeable industrial and EV batteries with internal storage and
    a capacity above 2 kWh
  mechanism: Mandatory performance and durability information for batteries covered by Article 10(1).
    Under Article 10(2), from 1 January 2026 minimum performance and durability values apply to rechargeable
    industrial batteries with internal storage and a capacity above 2 kWh, taking under-performing batteries
    off the market.
  impact: Users should get economic benefits through better value for money and more informed purchasing
    decisions, and the market should shift towards better-performing batteries.
  provision_keys:
  - batteries/proposal/art/10
  ia_section: 'Measure 7: Performance and durability of rechargeable industrial and EV batteries'
  category: consumers_users
  provenance: llm_judged
- expected_id: c09_e08
  affected_actor: Consumers buying portable batteries of general use
  mechanism: From 2027 portable batteries of general use must meet minimum electrochemical performance
    and durability values.
  impact: Consumers can more easily identify the best-value battery, and the long-term economic benefit
    of rechargeable batteries in high-drain appliances becomes clearer. Producers of better-performing
    batteries also get a more level playing field.
  provision_keys:
  - batteries/proposal/art/9
  ia_section: 'Measure 8: Non-rechargeable portable batteries'
  category: consumers_users
  provenance: llm_judged
- expected_id: c09_e09
  affected_actor: Economic operators placing rechargeable industrial and EV batteries on the market (around
    50 battery and vehicle manufacturers)
  mechanism: 'Mandatory supply-chain due diligence: a supply-chain policy, management systems, traceability,
    risk assessment and mitigation, third-party verification by notified bodies, and annual public reporting.'
  impact: An estimated €2–15 million in one-off costs and €2–20 million in annual costs. At company level
    this covers policy changes (€3 150–205 000), IT systems (€36 000–90 000), data collection and verification,
    audits, and due diligence and reporting. Companies also gain better knowledge of their supply chains
    and detect risks earlier.
  provision_keys:
  - batteries/proposal/art/39
  ia_section: 'Measure 13: Supply-chain due diligence for raw materials in industrial and EV batteries'
  category: compliance_cost
  provenance: llm_judged
- expected_id: c09_e10
  affected_actor: Workers and local communities in raw-material sourcing regions, including conflict-affected
    areas
  mechanism: Due diligence obligations require operators to identify, prevent and mitigate adverse social
    and environmental impacts in the supply chains of cobalt, lithium, nickel and natural graphite.
  impact: Political and social stability improves, human and labour rights are better protected, environmental
    protection is strengthened, and contamination and health problems are reduced. These benefits were
    not quantified.
  provision_keys:
  - batteries/proposal/art/39
  ia_section: 'Measure 13: Supply-chain due diligence for raw materials in industrial and EV batteries'
  category: social_environmental
  provenance: llm_tiebroken
- expected_id: c09_m07
  affected_actor: European Commission
  mechanism: The Commission has to support the carbon footprint rules by providing battery databases and
    battery passports for collecting market data, and by drafting the methodology acts.
  impact: Some support costs for the Commission.
  provision_keys:
  - batteries/proposal/art/7
  ia_section: 'Measure 6: Carbon footprint of rechargeable industrial and EV batteries'
  category: public_enforcement_cost
  provenance: llm_tiebroken
important_omissions:
