- candidate_id: c12_m01
  affected_actor: Data holders / data owners making datasets available
  mechanism: Where a data quality and utility label accompanies a dataset, data holders must give the
    health data access body enough documentation to confirm the label (Art 41(3)). This, together with
    their duty to describe and supply datasets (Art 41(2), 41(4)), means they pay to obtain and renew
    data quality labels.
  impact: The IA estimates label costs for data owners at EUR 25-81 million over 10 years. That is EUR
    20,000-50,000 to obtain a label and EUR 20,000-35,000 per year to renew it.
  why_missing: None of the drafted pairs names data holders as an affected actor. The drafted cost pairs
    cover only health data access bodies, data users and infrastructure operators.
  provision_keys:
  - ehds/proposal/art/41
  ia_section: 6.1.3.2 Impact of actions on secondary uses of health data
  ia_anchor: The one-off cost of a labelling scheme on data quality could amount to EUR 20,000 and EUR
    50,000 for obtaining the label and EUR 20,000 to EUR 35,000 per year for renewing the label for data
    holders
  anchor:
    status: verified
    against: ia
  category: compliance_cost
  derivability:
    verdict: partly
    reason: Art 41 sets out the data holder's documentation and supply duties. The label scheme itself
      and how much it costs come from Art 56 and the IA.
  flags: []
  judge:
    anchor_faithfulness:
      verdict: agree
      reason: Anchor and surrounding context give both the EUR 25-81 million total label cost and the
        EUR 20,000-50,000/EUR 20,000-35,000 per-label figures for data holders, matching the claim.
    derivability:
      verdict: agree
      reason: Art 41 establishes the data holder's documentation/supply duties relevant to labels, but
        the label mechanism and its cost structure stem from Art 56, outside scope, so 'partly' fits.
    category:
      verdict: agree
      reason: Here the cost is framed as the substantive expense of obtaining and maintaining a data quality
        label (technical/organisational effort), fitting compliance_cost.
    overall: agree
  tiebreak:
    verdict: drop
    original_category: compliance_cost
    reason: This repeats kept item c12_o02, which already covers the label documentation duty for data
      holders under Art 41(3) and the same EUR 20,000-50,000 and EUR 20,000-35,000 label costs.
    model: claude-opus-5-5
  provenance:
    origin: llm_recall
    status: llm_tiebroken
    drafting_model: claude-opus-5-5
  review:
    decision: llm_dropped
    audit: false
    reviewer: null
    note: null
- candidate_id: c12_m02
  affected_actor: Pharmaceutical manufacturers (marketing authorisation holders)
  mechanism: Real-world data made available under Art 33 to regulators, medicines agencies and HTA bodies
    for regulatory purposes (Art 34(1)(a)-(b), 34(2)) lets them renegotiate medicine prices after authorisation,
    based on observed effectiveness.
  impact: Public payers could renegotiate prices downward. One estimate is a 5% saving on drug costs in
    a medium-sized country, about EUR 50 million a year. This means less revenue for manufacturers whose
    products underperform.
  why_missing: The draft records the regulators' benefit from real-world data but not the matching effect
    on the pharmaceutical companies whose prices are renegotiated.
  provision_keys:
  - ehds/proposal/art/33
  - ehds/proposal/art/34
  ia_section: 6.1.3.2 Impact of actions on secondary uses of health data
  ia_anchor: supporting the EMA, national medicines agencies and HTA bodies in better decision-making
    and renegotiating the prices of different medicinal products based on the observed real-world effects,
    post-authorisation
  anchor:
    status: verified
    against: ia
  category: market_competition
  derivability:
    verdict: 'no'
    reason: The provisions only list the purposes and the public bodies that can use the data. The price
      renegotiation effect on manufacturers comes from the IA, and the cost to manufacturers is inferred,
      not stated.
  flags:
  - not_derivable_from_provisions
  judge:
    anchor_faithfulness:
      verdict: agree
      reason: Anchor describes EMA/agencies/HTA bodies renegotiating medicine prices based on real-world
        data with an estimated 5% (~EUR50m/year) saving, supporting the claim's described downward price
        pressure on manufacturers.
    derivability:
      verdict: agree
      reason: Art 33/34 only establish data availability and permitted regulatory purposes; they say nothing
        about price renegotiation or manufacturer revenue effects, so 'no' is correct.
    category:
      verdict: agree
      reason: Price renegotiation and reduced manufacturer revenue due to real-world evidence is a market/price
        effect.
    overall: agree
  tiebreak:
    verdict: drop
    original_category: market_competition
    reason: The IA describes savings for public payers from renegotiating prices but never mentions lost
      revenue for manufacturers. Arts 33 and 34 also say nothing about price renegotiation, so the claim
      is the drafter's inference.
    model: claude-opus-5-5
  provenance:
    origin: llm_recall
    status: llm_tiebroken
    drafting_model: claude-opus-5-5
  review:
    decision: llm_dropped
    audit: false
    reviewer: null
    note: null
