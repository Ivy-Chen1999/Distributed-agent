important_omissions:
- omission_id: c12_o01
  description: Data holders bear the costs of describing, preparing and supplying datasets within 2 months
    (Art 41(2),(4)). They also face daily fines and possible exclusion if they do not (Art 43(5)). Only
    micro enterprises are exempt (Art 33(2)), so small and medium-sized data holders that are not micro
    enterprises carry these costs in full. Fee compensation under Art 42(2) covers only part of them,
    so the burden may fall unevenly on smaller holders.
  source: ia
  provision_keys:
  - ehds/proposal/art/33
  - ehds/proposal/art/41
  - ehds/proposal/art/42
  - ehds/proposal/art/43
  ia_section: 6.1.4.2 Impact of actions on secondary uses of health data
  ia_anchor: possibly have a disproportionally adverse impact on smaller dataset owners
  anchor:
    status: verified
    against: ia
  category: sme_specific
  derivability:
    verdict: 'yes'
    reason: Art 33(2), 41(4) and 43(5) clearly set out who must supply data, the deadline, the penalties
      and the narrow micro-enterprise exemption.
  flags: []
  judge:
    anchor_faithfulness:
      verdict: disagree
      reason: The anchor attributes the disproportionate impact on smaller dataset owners to high certification
        scheme costs, not to the claim's described mechanism of dataset description/supply duties, daily
        fines, or partial fee compensation under Art 42(2).
    derivability:
      verdict: agree
      reason: Art 33(2) sets the micro-enterprise exemption, Art 41(2)/(4) impose description and 2-month
        supply duties, and Art 43(5) creates daily fines and exclusion for non-compliant data holders.
    category:
      verdict: agree
      reason: The claim explicitly concerns uneven cost burden on non-micro SMEs versus exempt micro-enterprises,
        which is an SME-specific effect.
    overall: disagree
  tiebreak:
    verdict: drop
    original_category: sme_specific
    reason: The anchor comes from section 6.1.4.2 on Policy Option 3, not the preferred option. It ties
      the harm to smaller dataset owners to high mandatory certification costs, not to the duties under
      Art 41, the fines under Art 43(5) or partial fee compensation.
    model: claude-opus-5-5
  provenance:
    origin: llm_drafted
    status: llm_tiebroken
    drafting_model: claude-opus-5-5
  review:
    decision: llm_dropped
    audit: false
    reviewer: null
    note: null
