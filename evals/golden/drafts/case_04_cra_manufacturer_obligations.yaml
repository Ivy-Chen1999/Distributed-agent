- expected_id: c04_e01
  affected_actor: Manufacturers of hardware and software products with digital elements
  mechanism: Essential requirements on secure design, development and production, a cybersecurity risk
    assessment, and vulnerability handling for the product's lifetime or 5 years (Art. 5, 10(1)-(2), 10(4),
    10(6))
  impact: Secure product development adds about 30.5% to product development costs where no security practices
    exist. That is about EUR 42 700 per average product unit of EUR 140 000. The costs are one-off and
    recurrent and cover security controls, skilled staff and security tools.
  provision_keys:
  - cra/proposal/art/5
  - cra/proposal/art/10
  ia_section: 6.3.1. Impacts on manufacturers of products with digital elements and other economic operators
  ia_anchor: This leads to 42 700 EUR of additional product development costs for an average product with
    digital elements unit (EUR 140 000).
  anchor:
    status: verified
    against: ia
  category: compliance_cost
  derivability:
    verdict: 'yes'
    reason: Art. 5 and 10 directly require manufacturers to build products to the essential requirements
      and to handle vulnerabilities, which clearly means substantive development costs.
  flags: []
