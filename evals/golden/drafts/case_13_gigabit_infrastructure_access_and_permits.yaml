  description: The in-building fibre mandate in Article 8 creates a direct installation cost for each
    premise. Building owners, developers and ultimately citizens bear this cost, either directly or through
    building prices; the IA puts the cost at around EUR 50 per installation for citizens. A good assessment
    must say who bears this cost, not only the savings to operators.
  source: ia
  provision_keys:
  - gigabit/proposal/art/8
  ia_section: 6.1. Economic impact
  ia_anchor: Cost of in-building infrastructure per premise (greenfield) EUR
  anchor:
    status: verified
    against: ia
  category: compliance_cost
  derivability:
