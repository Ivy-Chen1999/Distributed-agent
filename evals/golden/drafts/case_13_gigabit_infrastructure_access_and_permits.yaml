- expected_id: c13_e01
  affected_actor: Electronic communications network (ECN) operators deploying very high capacity networks
  mechanism: The right to access existing physical infrastructure of network operators and public sector
    bodies on fair and reasonable terms, together with the right to coordinate civil works, lets operators
    reuse ducts and poles and co-deploy instead of building new civil works.
  impact: Lower deployment capex, around EUR 12 billion to 2030. Network built by reusing infrastructure
    or coordinating civil works rises to about 470,000 km, against 250,000 km in the baseline.
  provision_keys:
  - gigabit/proposal/art/3
  - gigabit/proposal/art/5
  ia_section: 2. Summary of costs and benefits
  ia_anchor: Cost savings due to improved access to existing infrastructure and co-deployment opportunities
  anchor:
    status: verified
    against: ia
  category: innovation_investment
  derivability:
    verdict: 'yes'
    reason: Articles 3 and 5 give operators access and coordination rights whose aim is plainly to cut
      the cost of new civil works.
  flags: []
  judge:
    anchor_faithfulness:
      verdict: agree
      reason: The anchor directly attributes ~EUR12bn capex savings to ECN operators from improved infrastructure
        access/co-deployment, matching actor and mechanism; the km figures are corroborated elsewhere
        in the same IA and not contradicted here.
    derivability:
      verdict: agree
      reason: Art 3 grants access to existing infrastructure and Art 5 grants coordination of civil works,
        directly enabling reuse and co-deployment that cut capex.
    category:
      verdict: disagree
      reason: The claim is about reduced deployment capex (substantive cost savings), which is a compliance_cost
        effect rather than a market structure/competition effect.
    overall: disagree
  tiebreak:
    verdict: keep
    original_category: market_competition
    reason: Table 16 attributes ~EUR12bn reduced capex in VHCN deployment to ECN operators from improved
      access and co-deployment, and section 8.1 gives 470,000 km vs 250,000 km; Arts 3 and 5 grant those
      rights. This is reduced investment cost for network rollout, not a cost of complying or a change
      in market structure.
    model: claude-opus-5-5
  provenance:
    origin: llm_drafted
    status: llm_tiebroken
    drafting_model: claude-opus-5-5
