expected_impacts:
- expected_id: c10_e01
  affected_actor: Digital labour platforms that control the performance of work (mainly low-skill on-location
    platforms, some online micro-tasking platforms)
  mechanism: The legal presumption of employment, triggered when at least two control criteria are met,
    pushes platforms to reclassify the people working through them as employees, directly or through temporary
    work agencies, either voluntarily or after losing court cases.
  impact: One-off costs of changing the business model, plus higher recurrent wage costs (bringing pay
    up to the minimum wage) and non-wage costs (employer social contributions). The IA puts the annual
    cost of reclassification at EUR 1.87 – 4.46 billion.
  provision_keys:
  - platform_work/proposal/art/4
  ia_section: 'Annex 3: Who is affected and how? – Impacts on platforms'
  ia_anchor: The costs for platforms will relate not only to one-off expenses of changing the platform
    business models, but also increased recurrent wage and non-wage expenses.
  anchor:
    status: verified
    against: ia
  category: compliance_cost
  derivability:
    verdict: 'yes'
    reason: Article 4 presumes an employment relationship wherever the control criteria are met, so an
      expert can foresee that platforms will face employer wage and social contribution costs.
  flags: []
  judge:
    anchor_faithfulness:
      verdict: agree
      reason: Anchor and context describe platforms reclassifying workers (directly or via agencies) and
        facing one-off plus recurrent wage/non-wage costs, matching the claimed actor and mechanism; the
        cited billion-euro figure appears consistently elsewhere in the same IA cost tables.
    derivability:
      verdict: agree
      reason: Article 4's presumption of employment directly implies employer wage and social-contribution
        costs for platforms meeting the control criteria.
    category:
      verdict: agree
      reason: Higher wage and non-wage costs plus business-model changes are substantive costs of meeting
        employment requirements, i.e. compliance_cost.
    overall: agree
  provenance:
