- expected_id: c10_e02
  affected_actor: Digital labour platforms
  mechanism: The presumption applies in all administrative and legal proceedings. Rebutting it puts the
    burden of proof on the platform, and a rebuttal does not suspend the presumption. This makes it easier
    and cheaper for workers and authorities to challenge employment status.
  impact: Legal and non-compliance costs, currently tens to hundreds of millions of euros for on-location
    platforms, rise in the short to medium term. The IA expects them to fall below the baseline in the
    long run because the control criteria give legal certainty.
  provision_keys:
  - platform_work/proposal/art/4
  - platform_work/proposal/art/5
  ia_section: A3.2 Overview of costs of the preferred option
  ia_anchor: As Policy Option A3b would make it easier and less costly for people working through platforms
    to challenge their legal status, the legal and non-compliance costs are likely to be even higher in
    the short to medium term.
  anchor:
    status: verified
    against: ia
  category: compliance_cost
  derivability:
    verdict: 'yes'
    reason: Articles 4 and 5 shift the burden of proof onto platforms and allow all parties and authorities
      to rely on the presumption in proceedings, which points directly to more litigation exposure.
  flags: []
  judge:
    anchor_faithfulness:
      verdict: agree
      reason: Context states legal/non-compliance costs are tens to hundreds of millions, rise in short/medium
        term due to easier challenges, then fall below baseline long-term, matching the claim exactly.
    derivability:
      verdict: agree
      reason: Articles 4 and 5 together give the presumption universal procedural effect and shift the
        burden of proof to platforms, supporting greater litigation exposure.
    category:
      verdict: agree
      reason: Legal and non-compliance costs from rebutting the presumption are substantive costs of meeting
        the legal requirement, fitting compliance_cost.
    overall: agree
  provenance:
    origin: llm_drafted
    status: llm_judged
    drafting_model: claude-opus-5-5
  review:
    decision: auto_accepted
    audit: false
    reviewer: null
