    of the Big Tech companies in this field.
  anchor:
    status: verified
    against: ia
  category: market_competition
  derivability:
    verdict: 'yes'
    reason: Article 11(1)-(2) imposes purpose limitation and legal separation, which bind integrated firms
      in particular.
  flags: []
  judge:
    anchor_faithfulness:
