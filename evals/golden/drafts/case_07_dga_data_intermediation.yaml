    data for other purposes fall hardest on vertically integrated players and large platforms that currently
    combine intermediation with their own data use. They must restructure or stay out of the market. This
    shapes the platformisation risk the IA describes in its baseline.
  source: ia
  provision_keys:
  - dga/proposal/art/11
  ia_section: 6.1.1. Baseline scenario
