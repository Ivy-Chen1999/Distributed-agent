    gains, time savings, increase of the client base and data transactions and therefore increase in revenues
  anchor:
    status: verified
    against: ia
  category: market_competition
  derivability:
    verdict: partly
    reason: The provisions clearly aim at trustworthy intermediation, but the commercial benefit of more
      trust for compliant intermediaries is inferred, not stated.
  flags: []
