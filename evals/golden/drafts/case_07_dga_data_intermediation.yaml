- expected_id: c07_e02
  affected_actor: Providers of data sharing services (data intermediaries)
  mechanism: Binding neutrality and trust conditions, combined with notification and supervision, make
    intermediaries more trustworthy to data holders and data users.
  impact: More trust brings efficiency gains, time savings, a larger client base and more data transactions,
    and so higher revenues. The IA expects a 25-50% increase in revenues and client base.
  provision_keys:
  - dga/proposal/art/10
  - dga/proposal/art/11
  - dga/proposal/art/13
  ia_section: '6.1.3. Policy option 2: Lower intensity legislation'
