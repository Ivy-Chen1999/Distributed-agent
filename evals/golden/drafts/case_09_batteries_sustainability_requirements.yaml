- expected_id: c09_e01
  affected_actor: Producers of EV batteries and rechargeable industrial batteries above 2 kWh
  mechanism: They must draw up a carbon footprint declaration in the technical documentation for each
    battery model and batch per plant, and have it verified by an independent third party.
  impact: One-off calculation costs of €100–5 000 per battery type, plus €2 000–7 000 per battery type
    for verification, with small follow-up costs. Assuming about 50 producers, the total cost to industry
    is €500 000–3 000 000.
  provision_keys:
  - batteries/proposal/art/7
