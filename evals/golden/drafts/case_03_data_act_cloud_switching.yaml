  provision_keys:
  - data_act/proposal/art/24
  - data_act/proposal/art/26
  - data_act/proposal/art/27
  ia_section: 6.2.3. Intervention on cloud and edge services
  ia_anchor: This makes it difficult to distinguish the costs of regulatory compliance from the investments
    of the cloud providers under the baseline scenario.
  anchor:
    status: verified
    against: ia
  category: compliance_cost
  derivability:
    verdict: partly
    reason: The obligations that create costs are visible, but whether the estimates are reliable cannot
      be judged from the text.
  flags: []
  judge:
    anchor_faithfulness:
      verdict: agree
      reason: Context supports the claim that compliance costs can't be separated from baseline investment
        and that the benefit is framed as an assumption that costs are outweighed by additional demand
        accruing to providers.
    derivability:
      verdict: agree
      reason: The cost-generating obligations are visible in the text, but reliability of cost estimates
