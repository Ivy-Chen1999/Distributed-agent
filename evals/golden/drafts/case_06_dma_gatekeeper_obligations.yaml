- omission_id: c06_o01
  description: Who ultimately bears gatekeepers' compliance costs, and how large they are relative to
    the regulated activity. The IA says the costs are minuscule compared with gatekeeper revenues and
    would be absorbed rather than passed on to business users (for example through restricted access)
    or to consumers. A good assessment should address cost pass-through and scale.
  source: ia
  provision_keys:
  - dma/proposal/art/5
  - dma/proposal/art/6
  - dma/proposal/art/11
  ia_section: Businesses – Gatekeepers
  ia_anchor: Compliance costs under all options would be miniscule as compared to the gatekeepers revenues
    and could be absorbed by gatekeepers with little incentive for them to pass on costs to business users
  anchor:
    status: verified
    against: ia
  category: compliance_cost
  derivability:
    verdict: partly
    reason: The provisions show that gatekeepers carry the costs, but judging pass-through and relative
      scale needs market knowledge beyond the text.
  flags: []
  judge:
