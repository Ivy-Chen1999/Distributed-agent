- expected_id: c06_e03
  affected_actor: Competitors and new entrants (including providers of alternative app stores, ID services
    and ancillary services)
  mechanism: Gatekeepers may not favour their own products in ranking (Art 6(1)(d)). They must allow third-party
    apps and app stores (Art 6(1)(c)), give access to the same operating system, hardware and software
    features (Art 6(1)(f)), and may not force business users to use the gatekeeper's ID service (Art 5(e)).
  impact: Barriers to entry and expansion come down. Competitors can compete on the merits, for example
    by building their own distribution channels or ID services.
  provision_keys:
  - dma/proposal/art/5
  - dma/proposal/art/6
  ia_section: SMEs
  ia_anchor: Measures preventing unfair self-preferencing and limitations in interoperability would give
    them the ability to compete on the merits (e.g. develop their own distribution channels or their own
    ID services).
  anchor:
    status: verified
    against: ia
  category: market_competition
  derivability:
    verdict: 'yes'
    reason: The self-preferencing, interoperability and ID-service provisions name the third-party providers
      who benefit.
  flags: []
  judge:
    anchor_faithfulness:
      verdict: agree
      reason: Anchor quote directly states that preventing self-preferencing and limiting interoperability
        lets competitors/new entrants compete on the merits via own distribution channels or ID services,
        matching actor and mechanism.
    derivability:
      verdict: agree
      reason: Art 6(1)(c), (d), (f) and Art 5(e) name third-party app stores, ancillary-service providers
        and identification services as the intended beneficiaries of these anti-self-preferencing and
        interoperability duties.
    category:
      verdict: agree
      reason: Lower entry barriers and ability to compete on the merits is a market structure effect.
    overall: agree
