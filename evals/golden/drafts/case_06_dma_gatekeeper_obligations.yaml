expected_impacts:
- expected_id: c06_e01
  affected_actor: Designated gatekeepers
  mechanism: Gatekeepers must make sure the Article 5 and 6 obligations are fully and effectively complied
    with (Arts 7 and 11). They have to review their policies against the new rules, deal with the Commission
    and answer its requests.
  impact: Gatekeepers need extra legal compliance officers and staff to deal with the regulator. The IA
    estimates about 20 FTEs per gatekeeper platform. These costs would largely replace what gatekeepers
    already spend on complying with differing national measures.
  provision_keys:
  - dma/proposal/art/5
  - dma/proposal/art/6
  - dma/proposal/art/7
  - dma/proposal/art/11
  ia_section: Businesses – Gatekeepers
  ia_anchor: Such costs would imply some additional legal compliance officers to check company policies
    against the new rules; some employees to interface with the regulator and respond to requests for
    information.
  anchor:
    status: verified
    against: ia
  category: compliance_cost
  derivability:
    verdict: 'yes'
    reason: The provisions place a large set of conduct obligations, plus a duty to ensure effective compliance,
      directly on gatekeepers, so compliance staffing costs clearly follow.
  flags: []
  judge:
    anchor_faithfulness:
      verdict: agree
      reason: The anchor text matches the claimed mechanism (compliance officers, regulator liaison) and
        impact (compliance costs largely substituting national compliance costs); the 20-FTE figure is
        consistent with the same cost estimate appearing elsewhere in the IA.
    derivability:
      verdict: agree
      reason: Arts 5, 6, 7 and 11 impose a broad set of conduct obligations plus an explicit duty to ensure
        full and effective compliance, which clearly implies internal compliance resourcing.
    category:
      verdict: disagree
      reason: Reviewing policies, communicating with and answering the Commission's requests describes
        information/reporting duties to a regulator, which is administrative_burden rather than substantive
        compliance_cost.
    overall: disagree
