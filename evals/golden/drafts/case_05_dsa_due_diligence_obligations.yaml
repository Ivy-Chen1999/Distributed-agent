    options
  impact: One-off cost of up to EUR 15.000 for a notice-and-action technical system plus light maintenance.
    Costs rise with notice volume, to about EUR 1 million for 200 notices a day, and personnel is the
    main expense. For most companies this means adapting existing processes rather than a new cost.
  provision_keys:
