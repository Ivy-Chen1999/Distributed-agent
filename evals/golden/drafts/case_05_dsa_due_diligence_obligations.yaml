important_omissions:
- omission_id: c05_o01
  description: Micro and small hosting providers are not exempt from notice and action. Article 16 exempts
    only online platforms from the platform section, and Article 14 has no SME carve-out. A micro-enterprise
    receiving about 50 notices a year would still bear roughly EUR 15 000 per annum, which is large relative
    to its turnover.
  source: ia
  provision_keys:
  - dsa/proposal/art/14
  - dsa/proposal/art/16
  ia_section: 6.1. Economic impacts – SME test
  ia_anchor: an average micro-enterprise receiving a volume of 50 notices per annum, out of which 5% would
    make the object of a counter-notice procedure, should sustain a cost of approximately EUR 15 000 per
    annum
  anchor:
    status: verified
    against: ia
  category: sme_specific
  derivability:
    verdict: 'yes'
    reason: Article 14 applies to all hosting providers, and Article 16's exemption covers only online
      platforms.
  flags: []
  judge:
    anchor_faithfulness:
      verdict: agree
      reason: Context confirms SMEs cannot be fully exempted from notice-and-action and that an average
        micro-enterprise with 50 notices/year bears about EUR 15.000 per annum, matching the claim's core
        assertion even though the specific article numbers aren't in this excerpt.
    derivability:
      verdict: agree
      reason: Article 14 contains no SME carve-out and Article 16's exemption is limited to the online-platforms
        section, not Article 14's hosting-services section.
    category:
      verdict: agree
      reason: This is squarely about the disproportionate burden of a non-exempted obligation on micro-enterprises,
        matching sme_specific.
    overall: agree
  provenance:
    origin: llm_drafted
    status: llm_judged
    drafting_model: claude-opus-5-5
  review:
    decision: auto_accepted
    audit: false
    reviewer: null
    note: null
- omission_id: c05_o02
  description: Platforms' costs from notice handling, complaints and out-of-court dispute settlement scale
    with the volume of notices, complaints and escalations. Platforms also pay the recipient's fees when
    they lose an out-of-court dispute, and they cannot recover their own fees when they win.
  source: ia
