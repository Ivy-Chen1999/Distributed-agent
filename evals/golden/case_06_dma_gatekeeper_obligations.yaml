case_id: case_06_dma_gatekeeper_obligations
scenario_id: eval_gatekeeper_obligations
ia_reference: 'Impact assessment accompanying the Digital Markets Act proposal (identifiers in the local
  IA index); sections: Businesses; Consumers; 3.2. Overview of costs'
fixture: dma
split: train
notes: 'Drafted on 2026-10-06 by claude-opus-5-5 (scripts/draft_golden_case.py) and checked by isolated
  LLM judges, open items settled by a tie-break judge. Human review by nobody (all items auto-accepted);
  published on 2026-10-19. Decisions: auto_accepted 13, verified 0, edited 0, llm_kept 5, rejected 0,
  unclear 0, llm_dropped 3. Audit: 0/4 sampled items decided, 0 edited/rejected/unclear. Dropped by the
  tie-break judge: [''c06_m02'', ''c06_m05'', ''c06_m06'']. Corrected after a failed reference check (human
  feedback), by an AI full-text review from 2026-10-17; not re-checked by people: trimmed none, modality
  restored none, rewritten [''c06_o04'', ''c06_m03'', ''c06_m07''], dropped none.'
expected_impacts:
- expected_id: c06_e01
  affected_actor: Designated gatekeepers
  mechanism: Gatekeepers must make sure the Article 5 and 6 obligations are fully and effectively complied
    with (Arts 7 and 11). They have to review their policies against the new rules, deal with the Commission
    and answer its requests.
  impact: Gatekeepers need extra legal compliance officers and staff to deal with the regulator. The IA
    estimates about 20 FTEs per gatekeeper platform. These costs would largely replace what gatekeepers
    already spend on complying with differing national measures.
  provision_keys:
  - dma/proposal/art/5
  - dma/proposal/art/6
  - dma/proposal/art/7
  - dma/proposal/art/11
  ia_section: Businesses – Gatekeepers
  category: administrative_burden
  provenance: llm_tiebroken
- expected_id: c06_e02
  affected_actor: Designated gatekeepers
  mechanism: 'Practices that are central to gatekeeper business models are banned or restricted: combining
    data, self-preferencing, MFN clauses, tying, and using business users'' data.'
  impact: These indirect costs may be larger than compliance costs. Gatekeepers would have to change their
    business models, lose some revenue and may see their supra-normal profits fall. The IA says this effect
    is hard to quantify.
  provision_keys:
  - dma/proposal/art/5
  - dma/proposal/art/6
  - dma/proposal/art/11
  ia_section: Businesses – Gatekeepers
  category: market_competition
  provenance: llm_judged
- expected_id: c06_e03
  affected_actor: Competitors and new entrants (including providers of alternative app stores, ID services
    and ancillary services)
  mechanism: Gatekeepers may not favour their own products in ranking (Art 6(1)(d)). They must allow third-party
    apps and app stores (Art 6(1)(c)), give access to the same operating system, hardware and software
    features (Art 6(1)(f)), and may not force business users to use the gatekeeper's ID service (Art 5(e)).
  impact: Barriers to entry and expansion come down. Competitors can compete on the merits, for example
    by building their own distribution channels or ID services.
  provision_keys:
  - dma/proposal/art/5
  - dma/proposal/art/6
  ia_section: SMEs
  category: market_competition
  provenance: llm_judged
- expected_id: c06_e04
  affected_actor: Competing online intermediation services (alternative distribution channels)
  mechanism: Gatekeepers must let business users offer different prices or conditions through third-party
    intermediation services, which bans parity (MFN) clauses (Art 5(b)).
  impact: Competitors have more reason to build alternative distribution channels, because business users
    can reward better service or lower fees with better terms.
  provision_keys:
  - dma/proposal/art/5
  ia_section: SMEs
  category: market_competition
  provenance: llm_judged
- expected_id: c06_e05
  affected_actor: Business users of gatekeeper platforms
  mechanism: Gatekeepers may not use non-public data generated by business users and their end users to
    compete against those business users (Art 6(1)(a), 6(2)).
  impact: Business users are protected from their data being exploited only for the platform's benefit.
    This gives them more confidence to sell online.
  provision_keys:
  - dma/proposal/art/6
  ia_section: SMEs
  category: market_competition
  provenance: llm_judged
- expected_id: c06_e06
  affected_actor: Business users of gatekeeper platforms
  mechanism: Gatekeepers must give business users free, continuous, real-time access to data generated
    through their use of the core platform service (Art 6(1)(i)), with consent arrangements that are no
    more burdensome than for the gatekeeper's own services (Art 11(2)).
  impact: Business users can adapt their business models to demand and better meet customers' expectations.
  provision_keys:
  - dma/proposal/art/6
  - dma/proposal/art/11
  ia_section: SMEs
  category: market_competition
  provenance: llm_judged
- expected_id: c06_e07
  affected_actor: Business users of gatekeeper platforms
  mechanism: Gatekeepers may not make access conditional on subscribing to other core platform services
    (Art 5(f)). Business users are free to steer customers and contract outside the platform (Art 5(c)),
    and to use other intermediaries on different terms (Art 5(b)).
  impact: Business users can multi-home and switch more easily, choose and combine services as they need,
    and benefit from lower intermediation prices and lower distribution costs.
  provision_keys:
  - dma/proposal/art/5
  ia_section: SMEs
  category: market_competition
  provenance: llm_judged
- expected_id: c06_e08
  affected_actor: End users / consumers
  mechanism: Effective data portability with real-time access (Art 6(1)(h)), the right to uninstall pre-installed
    apps (Art 6(1)(b)), sideloading and third-party app stores (Art 6(1)(c)), and a ban on technically
    restricting switching (Art 6(1)(e)). Gatekeepers may not degrade services or make it hard for users
    to exercise these choices (Art 11(3)).
  impact: Search and switching costs fall, so consumers can multi-home across platforms and get better
    quality, wider choice and more innovative services at affordable prices.
  provision_keys:
  - dma/proposal/art/6
  - dma/proposal/art/11
  ia_section: Consumers
  category: consumers_users
  provenance: llm_judged
- expected_id: c06_e09
  affected_actor: Advertisers and publishers (and, downstream, consumers)
  mechanism: On request, gatekeepers must provide price and remuneration information for advertising services
    (Art 5(g)) and free access to performance-measuring tools and the data needed for independent verification
    of ad inventory (Art 6(1)(g)).
  impact: Greater transparency and contestability are expected to lower prices for advertisers, which
    then pass through to lower consumer prices. The IA notes that a 10% fall in ad spending would bring
    gains of more than EUR 5 billion per year.
  provision_keys:
  - dma/proposal/art/5
  - dma/proposal/art/6
  ia_section: Consumers
  category: market_competition
  provenance: llm_judged
- expected_id: c06_e10
  affected_actor: End users / consumers (as data subjects)
  mechanism: Gatekeepers may not combine personal data across services without specific consent (Art 5(a)).
    They must submit an independently audited description of their consumer profiling techniques (Art
    13), and compliance must respect the GDPR and ePrivacy rules (Art 7(1)).
  impact: Consumers would understand more clearly what data is collected about them and how it is used,
    and would have more control over their data.
  provision_keys:
  - dma/proposal/art/5
  - dma/proposal/art/13
  - dma/proposal/art/7
  ia_section: Consumers
  category: fundamental_rights
  provenance: llm_judged
- expected_id: c06_m01
  affected_actor: European Commission
  mechanism: Under Art 7(2), (4) and (5) the Commission may decide which measures a gatekeeper must implement
    to comply with Art 6. To do so it must open proceedings, issue preliminary findings within 3 months
    and adopt a decision within 6 months, which creates implementation and supervision costs.
  impact: 'Higher regulatory costs: Option 2 is estimated at about €16.7m a year (80 FTEs plus experts,
    IT and meetings), partly because the Commission specifies obligations for individual gatekeepers.'
  provision_keys:
  - dma/proposal/art/7
  ia_section: 3.2. Overview of costs
  category: public_enforcement_cost
  provenance: llm_tiebroken
- expected_id: c06_m03
  affected_actor: Designated gatekeepers
  mechanism: Under Art 7(7) a gatekeeper can ask for a regulatory dialogue and request a Commission decision
    on whether its intended Art 6 measures are effective. This could make implementation more flexible
    and help create legal certainty.
  impact: Lower compliance costs, and implementation that disrupts commercial relationships with business
    users less than self-executing obligations would.
  provision_keys:
  - dma/proposal/art/7
  ia_section: 3.2. Overview of costs
  category: compliance_cost
  provenance: llm_tiebroken
- expected_id: c06_m04
  affected_actor: Business users of gatekeeper platforms (especially SMEs)
  mechanism: Bans on parity clauses, tying and anti-steering (Art 5(b), (c), (f)) and fair access conditions
    (Art 6(1)(k)) increase multi-homing and competition between intermediaries.
  impact: Lower prices for intermediation services, lower distribution costs and more choice of platforms.
  provision_keys:
  - dma/proposal/art/5
  - dma/proposal/art/6
  ia_section: Businesses
  category: market_competition
  provenance: llm_tiebroken
- expected_id: c06_m07
  affected_actor: Designated gatekeepers
  mechanism: More contestable markets created by the Art 5 and 6 obligations increase competitive pressure
    on gatekeepers, which have to keep a large user base.
  impact: Stronger incentives for gatekeepers to innovate, bring new products to market and offer lower
    prices, even though their business models may be affected.
  provision_keys:
  - dma/proposal/art/5
  - dma/proposal/art/6
  ia_section: Businesses
  category: innovation_investment
  provenance: llm_tiebroken
important_omissions:
- omission_id: c06_o01
  description: Who ultimately bears gatekeepers' compliance costs, and how large they are relative to
    the regulated activity. The IA says the costs are minuscule compared with gatekeeper revenues and
    would be absorbed rather than passed on to business users (for example through restricted access)
    or to consumers. A good assessment should address cost pass-through and scale.
  provision_keys:
  - dma/proposal/art/5
  - dma/proposal/art/6
  - dma/proposal/art/11
  source: Impact assessment, Businesses – Gatekeepers
  category: compliance_cost
  provenance: llm_judged
- omission_id: c06_o02
  description: 'A downside for consumers: when business users can sell through several channels and steer
    customers off-platform (Art 5(b), 5(c)), offers become spread across more platforms. This can raise
    consumers'' search costs, although consumers can still use the gatekeeper''s service if they prefer.'
  provision_keys:
  - dma/proposal/art/5
  source: Impact assessment, Consumers
  category: consumers_users
  provenance: llm_judged
- omission_id: c06_o03
  description: Whether gatekeepers might react to the obligations by ending or degrading services to dependent
    SMEs. The IA does not expect this because of network effects, and Art 11(3) bans degrading services
    for users who exercise their rights. This risk for SME business users should be addressed.
  provision_keys:
  - dma/proposal/art/11
  - dma/proposal/art/5
  - dma/proposal/art/6
  source: Impact assessment, SMEs
  category: sme_specific
  provenance: llm_judged
- omission_id: c06_o04
  description: 'The information and reporting duties on gatekeepers: notifying all intended digital-sector
    concentrations with turnover and user data (Art 12), submitting and updating every year an independently
    audited description of profiling techniques (Art 13), and optionally making reasoned submissions in
    specification proceedings (Art 7). These create administrative burden separate from the substantive
    conduct changes.'
  provision_keys:
  - dma/proposal/art/12
  - dma/proposal/art/13
  - dma/proposal/art/7
  source: Impact assessment, 3.2. Overview of costs
  category: administrative_burden
  provenance: llm_judged
