important_omissions:
- omission_id: c13_o02
  description: Public sector bodies must meet reasonable access requests on fair, reasonable and non-discriminatory
    terms and give written reasons for any refusal within 1 month. Their administrative costs may go up
    or down. This depends on whether Member States standardise the terms and set up a coordinating body
    under Article 3(4).
  provision_keys:
  - gigabit/proposal/art/3
  source: Impact assessment, 2. Summary of costs and benefits
  category: public_enforcement_cost
  provenance: llm_judged
