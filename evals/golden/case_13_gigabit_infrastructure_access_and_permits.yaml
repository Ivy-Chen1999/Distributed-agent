expected_impacts:
- expected_id: c13_e01
  affected_actor: Electronic communications network (ECN) operators deploying very high capacity networks
  mechanism: The right to access existing physical infrastructure of network operators and public sector
    bodies on fair and reasonable terms, together with the right to coordinate civil works, lets operators
    reuse ducts and poles and co-deploy instead of building new civil works.
  impact: The IA estimates lower deployment capex of around EUR 12 billion to 2030, and about 470,000
    km of network built by reusing infrastructure or coordinating civil works, against 250,000 km in the
    baseline.
  provision_keys:
  - gigabit/proposal/art/3
  - gigabit/proposal/art/5
  ia_section: 2. Summary of costs and benefits
  category: compliance_cost
  provenance: llm_tiebroken
- expected_id: c13_e02
  affected_actor: ECN operators requesting access
  mechanism: 'Clearer access rules set out in the text: pricing criteria, a closed list of refusal grounds
    with written reasons within 1 month, and in-building access rules. These make negotiations simpler
    and reduce disputes.'
  impact: Administrative cost savings of around EUR 24m per year.
  provision_keys:
  - gigabit/proposal/art/3
  - gigabit/proposal/art/9
  ia_section: 2. Summary of costs and benefits
  category: administrative_burden
  provenance: llm_judged
- expected_id: c13_e03
  affected_actor: ECN operators applying for permits and rights of way
  mechanism: Electronic submission of permit applications through a single information point, a 4-month
    decision deadline, tacit approval, permit exemptions and fees capped at administrative costs.
  impact: The IA expects faster deployment and estimates administrative savings of about EUR 15m per year
    from simpler permit application processes.
  provision_keys:
  - gigabit/proposal/art/7
  ia_section: 2. Summary of costs and benefits
  category: administrative_burden
  provenance: llm_judged
- expected_id: c13_e04
  affected_actor: Competent (local) authorities granting permits
  mechanism: Member States must ensure consistent permit rules across the national territory. Competent
    authorities must support electronic applications and status tracking through a single information
    point and decide within the applicable deadlines.
  impact: The IA estimates large up-front costs of about EUR 70m in total for the preferred option, including
    EUR 35-40m in one-off costs associated with local authorities. Over the medium term, local authorities
    could save about EUR 3-4m per year.
  provision_keys:
  - gigabit/proposal/art/7
  ia_section: 8.1. Outcome of comparison of policy options
  category: public_enforcement_cost
  provenance: llm_judged
- expected_id: c13_e05
  affected_actor: Network operators and public sector bodies holding physical infrastructure or planning
    civil works
  mechanism: Duties to supply georeferenced minimum information on existing infrastructure, allow on-site
    surveys, and notify planned civil works in advance through the single information point.
  impact: The IA estimates new administrative costs for implementing georeferencing and supplying and
    updating infrastructure and civil-works information. It puts aggregate one-off adjustment costs for
    other network operators at roughly EUR 5-7m.
  provision_keys:
  - gigabit/proposal/art/4
  - gigabit/proposal/art/6
  ia_section: 2. Summary of costs and benefits
  category: administrative_burden
  provenance: llm_judged
- expected_id: c13_e06
  affected_actor: Other (non-telecom) network operators, e.g. energy and transport
  mechanism: Access requests and civil-works coordination requests from telecom operators lead to rental
    of their infrastructure and sharing of works.
  impact: New revenue and cost-saving opportunities, plus synergies with digitising their core business,
    such as smart energy.
  provision_keys:
  - gigabit/proposal/art/3
  - gigabit/proposal/art/5
  ia_section: 2. Summary of costs and benefits
  category: innovation_investment
  provenance: llm_tiebroken
- expected_id: c13_e07
  affected_actor: Member States (public subsidy budgets)
  mechanism: Infrastructure reuse and co-deployment under the access and coordination rules reduce the
    funding gap for rolling out very high capacity networks in non-viable areas.
  impact: Subsidies needed to reach 90% FTTH coverage could fall by about EUR 2.4 billion.
  provision_keys:
  - gigabit/proposal/art/3
  - gigabit/proposal/art/5
  ia_section: 2. Summary of costs and benefits
  category: other
  provenance: llm_judged
- expected_id: c13_e08
  affected_actor: ECN operators connecting new or renovated buildings
  mechanism: The mandatory fibre-ready in-building infrastructure, fibre wiring and access point in new
    and majorly renovated buildings, combined with the right to access that infrastructure on fair and
    non-discriminatory terms.
  impact: Faster deployment and savings of around EUR 200 per new or renovated premise.
  provision_keys:
  - gigabit/proposal/art/8
  - gigabit/proposal/art/9
  ia_section: 2. Summary of costs and benefits
  category: compliance_cost
  provenance: llm_judged
- expected_id: c13_e09
  affected_actor: Mobile network operators deploying 5G small cells
  mechanism: Categories of deployment exempted from permit procedures by implementing act, a ban on individual
    prior permits for those elements, and shorter permit deadlines.
  impact: Faster mid-band 5G deployment, with coverage reaching about 77% of the population by 2030 against
    75% in the status quo.
  provision_keys:
  - gigabit/proposal/art/7
  ia_section: 8.1. Outcome of comparison of policy options
  category: innovation_investment
  provenance: llm_judged
- expected_id: c13_e10
  affected_actor: Citizens and consumers (end-users)
  mechanism: Deployment cost savings from infrastructure reuse, co-deployment and in-building fibre are
    passed on through lower prices or wider coverage.
  impact: 'Lower Gigabit broadband prices or wider Gigabit coverage: 6.5% more households if FTTH, or
    9.1% if 5G FWA.'
  provision_keys:
  - gigabit/proposal/art/3
  - gigabit/proposal/art/5
  - gigabit/proposal/art/8
  ia_section: 2. Summary of costs and benefits
  category: consumers_users
  provenance: llm_judged
- expected_id: c13_m01
  affected_actor: Construction companies and building owners/developers
  mechanism: Duty to fit fibre-ready in-building infrastructure, fibre wiring and (in multi-dwelling buildings)
    access points in new and majorly renovated buildings to nationally adopted standards, with certified
    test reports as a condition for the building permit.
  impact: One-off adjustment costs (about EUR1-2m) for construction companies, and buildings that could
    become more valuable or earn more rent once they are fibre-ready.
  provision_keys:
  - gigabit/proposal/art/8
  ia_section: 8.1. Outcome of comparison of policy options
  category: compliance_cost
  provenance: llm_tiebroken
- expected_id: c13_m02
  affected_actor: Dispute settlement bodies
  mechanism: Clearer statutory rules on access pricing, refusal grounds, civil-works cost allocation and
    in-building access, possibly with Commission/BEREC guidance, cut the number of disputes referred to
    DSBs.
  impact: Fewer disputes and less DSB resources needed to resolve them.
  provision_keys:
  - gigabit/proposal/art/3
  - gigabit/proposal/art/5
  - gigabit/proposal/art/9
  ia_section: 2. Summary of costs and benefits
  category: public_enforcement_cost
  provenance: llm_tiebroken
- expected_id: c13_m03
  affected_actor: Local authorities / public sector bodies owning non-network physical infrastructure
  mechanism: The obligation to meet reasonable access requests to public physical infrastructure on fair,
    reasonable and non-discriminatory terms, including price, creates access revenue and synergies with
    smart-city digitisation.
  impact: New revenue and cost-saving opportunities for municipalities, with synergies for digitising
    their core business (smart cities).
  provision_keys:
  - gigabit/proposal/art/3
  ia_section: 2. Summary of costs and benefits
  category: innovation_investment
  provenance: llm_tiebroken
- expected_id: c13_m05
  affected_actor: SME ECN operators without their own physical infrastructure
  mechanism: The right to access existing physical infrastructure and in-building infrastructure lets
    operators without their own ducts or poles deploy without building new civil works.
  impact: These operators gain the most from the cost reductions, and SME ECN operators face lower administrative
    burdens.
  provision_keys:
  - gigabit/proposal/art/3
  - gigabit/proposal/art/9
  ia_section: 2. Summary of costs and benefits
  category: sme_specific
  provenance: llm_tiebroken
- expected_id: c13_m06
  affected_actor: Citizens and consumers (end-users)
  mechanism: Fibre-ready in-building infrastructure and access points, open to any provider on fair and
    non-discriminatory terms, allow more than one network to serve each building.
  impact: Lower FTTH connection costs and more infrastructure competition at building level.
  provision_keys:
  - gigabit/proposal/art/8
  - gigabit/proposal/art/9
  ia_section: 2. Summary of costs and benefits
  category: market_competition
  provenance: llm_tiebroken
- expected_id: c13_m07
  affected_actor: Environment / society (GHG emissions)
  mechanism: More reuse of existing ducts and poles and more coordinated civil works reduce new civil
    engineering for VHCN rollout.
  impact: About 0.7 Mt of GHG emissions avoided to 2030, roughly a 1% reduction compared with the status
    quo.
  provision_keys:
  - gigabit/proposal/art/3
  - gigabit/proposal/art/5
  ia_section: 8.1. Outcome of comparison of policy options
  category: social_environmental
