# Regression cases for checking answer-key points against their source (plan 2026-10-16-001).
#
# Found because a reference check (sample 2026-10-14-75af237c, two annotators) failed; every case
# below was settled on the whole source, not on the annotators' or a model's verdict: the
# feedback pointed at the problem, the source decided it. Any checker of answer-key points
# (fidelity check, sweep, tie-break) must reproduce `expected` on these claims.
#
# Fields: id; case and point; claim (the clause at issue, as the point stated it before any
# fix); expected (supported | not_supported); kind; source (file:line under .cache/ia/<fixture>/
# or the proposal article) and why. `law_context` marks a claim the key keeps because the
# proposal's text states it: a check must not drop it for want of an IA sentence. `window` marks a claim supported outside the ~900-character
# card window: a window-only check gets it wrong. Each claim is judged as written, modality
# included: a prediction stated as fact is not supported (see m01), so supported claims keep the
# source's "expected", "may" or "likely". These are acceptance cases for a checker; the test
# beside them checks only the data, not any checker's verdicts.
# Each case freezes its input: the full point as drafted, before any fix (`input.point`), its
# anchor and the sha256 of every source it may be checked against. `claim` names the clause
# this case judges; one point can hold a supported and an unsupported clause (w12 and o01).
cases:
- id: w01
  case: case_04_cra_manufacturer_obligations
  point: c04_m07
  kind: window
  expected: supported
  claim: software firms rated their expected costs high to very high
  source: cra/ia_full.txt:739
  why: '"software manufacturers indicated in average ''high to very high costs'' (4.21 out of 5)"'
  input:
    fixture: cra
    companion: false
    anchored_on: ia
    section: 6.3.1. Impacts on manufacturers of products with digital elements and other economic operators
    anchor: For software manufacturers, it is assumed that the BaU factor would be lower, given that less
      software products are today covered by NLF legislation.
    point:
      affected_actor: Software manufacturers, especially of non-embedded software
      mechanism: Fewer software products are covered by existing product-safety (NLF) laws, so their existing
        compliance baseline (business-as-usual costs) is lower. Conformity assessment and secure development
        therefore add proportionally more cost (Art. 10, 24).
      impact: Software manufacturers bear higher extra compliance costs than hardware manufacturers. The
        IA assumes 25% of software testing costs are already incurred, against 40% for hardware, and software
        firms rated their expected costs high to very high.
    sources:
      ia: a053047db53c117468cbc66692bc19ab6e7149689f56caf4c82aa75cb5570d7f
      rsb_opinion: 4bb5a6c54bc5f9a5fbc8df9996d21f8180bda07e067bca6b0808d13bde51233a
      law: 40b40802f61edd83c484305d26e35b81ecae7fbaf0c45f00becaddcba480ac1a
