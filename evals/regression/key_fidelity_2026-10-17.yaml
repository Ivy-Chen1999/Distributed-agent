  expected: not_supported
  claim: the extra demand goes mostly to providers
  source: data_act/ia_full.txt:698-700
  why: extra demand outweighs providers' initial costs; no relative split of benefits
  input:
    fixture: data_act
    companion: false
    anchored_on: ia
    section: 6.2.3. Intervention on cloud and edge services
    anchor: This makes it difficult to distinguish the costs of regulatory compliance from the investments
      of the cloud providers under the baseline scenario.
    point:
      description: Provider compliance costs are not quantified (Table 6 shows 'n/a'), and the IA admits
        that costs from Article 27 safeguards cannot be separated from baseline investment. The net-benefit
        claim therefore rests on an assumption that initial costs are outweighed by extra demand, which
        goes mostly to providers, not on a costed comparison.
