- id: o03
  case: case_12_ehds_secondary_use_obligations
  point: c12_o04
  kind: over_inference
  expected: not_supported
  claim: data subjects lose consent control as the price of the savings (as a board request)
  source: ehds/rsb_opinion.txt:60-62
  why: the board asks whether benefits come from consent or from safeguarding rights; it asserts no trade-off.
    Both annotators and the page AI missed it
  input:
    fixture: ehds
    companion: true
    anchored_on: rsb_opinion
    section: RSB second opinion (positive), (C) What to improve, point (3)
    anchor: The report should clarify if the benefits from data governance by Health Data Access
    point:
      description: Under Art 33(5), health data access bodies give access on the basis of the Chapter's
        obligations even where national law requires the data subject's consent. Data subjects therefore
        lose the individual consent control they have today. The savings that come from not having to
        obtain consent are paid for by that loss of control. A good assessment should say that this is
        a shift in rights away from data subjects, and that the permit and purpose rules (Art 34, Art
        46) must act as the replacement safeguard.
    sources:
      ia: f46808adc8e26712052fb78b0430dabf8be24dd91dff3e7a79d6f477eb2b16ee
      rsb_opinion: 1314b5bfffe475ec1c583bd9ded3659f5eaf5ab445aaa00b0f439b3c3e599daf
      law: 9a70f5acff017ded452ca32d1b9e543a795e813e3f1a2c472692f59942ba7d44
