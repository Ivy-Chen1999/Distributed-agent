- id: g02
  case: case_04_cra_manufacturer_obligations
  point: c04_e07
  kind: group_mismatch
  expected: not_supported
  claim: the burden on importers and distributors is not expected to be significant
  source: cra/ia_full.txt:857
  why: said by SME representatives about SME importers and distributors only
  input:
    fixture: cra
    companion: false
    anchored_on: ia
    section: 6.3.1. Impacts on manufacturers of products with digital elements and other economic operators
    anchor: The main costs for importers and distributors would be adjustment costs related to familiarisation
      related to the new requirements.
    point:
      affected_actor: Importers and distributors
      mechanism: Verification duties (conformity assessment done, CE marking, documentation, contact details),
        corrective action, informing authorities and record-keeping (Art. 13, 14)
      impact: Their main costs are familiarisation with the new requirements. These were not quantified;
        as a benchmark, under the Toy Safety Directive it took 110 man-hours per type for importers and
        86 for distributors. Because security must already be ensured by the manufacturer, the burden
        is not expected to be significant.
