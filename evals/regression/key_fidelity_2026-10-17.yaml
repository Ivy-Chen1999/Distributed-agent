- id: o06
  case: case_04_cra_manufacturer_obligations
  point: c04_m01
  kind: over_inference
  expected: not_supported
  claim: which puts them at a competitive disadvantage against large and non-EU firms
  source: cra/ia_full.txt:847-849
  why: a stakeholder worry, with survey SMEs neutral; stated as fact
  input:
    fixture: cra
    companion: false
    anchored_on: ia
    section: 6.3.2. Impact on SMEs
    anchor: In terms of costs, SMEs as manufacturers would in principle be more affected than large companies
      for several reasons.
    point:
      affected_actor: SME manufacturers of products with digital elements
      mechanism: Fixed costs of secure development, getting to know the new rules and showing conformity
        hit SMEs harder. They have smaller customer bases, little in-house expertise and limited lab capacity,
        so they turn to external consultants and testing labs (Art. 5, 10).
      impact: SME manufacturers face higher relative compliance costs than large firms. Some may struggle
        to bear them and could leave the market, which puts them at a competitive disadvantage against
        large and non-EU firms.
    sources:
      ia: a053047db53c117468cbc66692bc19ab6e7149689f56caf4c82aa75cb5570d7f
      rsb_opinion: 4bb5a6c54bc5f9a5fbc8df9996d21f8180bda07e067bca6b0808d13bde51233a
      law: 40b40802f61edd83c484305d26e35b81ecae7fbaf0c45f00becaddcba480ac1a
- id: o07
  case: case_04_cra_manufacturer_obligations
  point: c04_o06
  kind: over_inference
  expected: not_supported
  claim: late standards raise notified-body demand (as the board's request)
  source: cra/rsb_opinion.txt:93-96
  why: the board asks whether standards arrive in time and stay current; the notified-body effect is a
    legal inference, not the board's request
  input:
    fixture: cra
    companion: true
    anchored_on: rsb_opinion
    section: (C) What to improve
    anchor: the role and effectiveness of standardisation processes in effectively ensuring that the advocated
      solution is delivered in due time
    point:
      description: The timing of harmonised standards directly affects how many manufacturers must use
        a notified body. Under Art. 24(2), manufacturers of class I critical products must use third-party
        procedures (module B+C or H) if they have not applied harmonised standards, common specifications
        or certification schemes, or if none exist. If standards are late or out of date in a fast-moving
        digital sector, more class I manufacturers will face higher-cost notified-body assessment. Demand
        on notified bodies would also rise.
    sources:
      ia: a053047db53c117468cbc66692bc19ab6e7149689f56caf4c82aa75cb5570d7f
      rsb_opinion: 4bb5a6c54bc5f9a5fbc8df9996d21f8180bda07e067bca6b0808d13bde51233a
      law: 40b40802f61edd83c484305d26e35b81ecae7fbaf0c45f00becaddcba480ac1a
- id: g01
  case: case_11_pld_liability_software_burden_of_proof
  point: c11_e10
  kind: group_mismatch
  expected: not_supported
  claim: importers bear new liability exposure
  source: pld/ia_full.txt:208,1438
  why: importers are already liable under the current PLD
  input:
    fixture: pld
    companion: false
    anchored_on: ia
    section: 8. Preferred option
    anchor: it would ensure the liability of an EU-based responsible person for defective products, in
      line with market surveillance rules.
    point:
      affected_actor: Importers, authorised representatives and fulfilment service providers of non-EU
        manufacturers
      mechanism: Where the manufacturer is established outside the Union, the importer and authorised
        representative, and failing them the fulfilment service provider, can be held liable (Art. 7(2)–(3);
        definitions in Art. 4)
      impact: There is always an EU-based person liable for defective products, in line with market surveillance
        rules. These operators bear new liability exposure.
    sources:
