      description: Art 33(1) and (3) require private data holders to supply their data, including makers
        of medical devices and wellness apps, clinical trial sponsors, biobanks, and holders of insurance
        and claims data. Their competitors can then obtain this data through permits at cost-based fees
        (Art 42). A good assessment should name the private and public markets affected and describe the
        competitive effect on the firms that must share data and on the firms that receive it.
    sources:
      ia: f46808adc8e26712052fb78b0430dabf8be24dd91dff3e7a79d6f477eb2b16ee
      rsb_opinion: 1314b5bfffe475ec1c583bd9ded3659f5eaf5ab445aaa00b0f439b3c3e599daf
      law: 9a70f5acff017ded452ca32d1b9e543a795e813e3f1a2c472692f59942ba7d44
- id: o05
  case: case_03_data_act_cloud_switching
  point: c03_o01
