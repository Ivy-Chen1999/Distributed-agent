# R37 diff regression check: reference answers for the R2 demo scenario demo_penalties_amended
# (AI Act proposal COM(2021) 206 -> Regulation (EU) 2024/1689: provider obligations Art 16 -> 16,
# SME measures Art 55 -> 62, penalties Art 71 -> 99). Self-evolution plan U8; origin R37.
#
# HUMAN STEP. These answers are written BY HAND by one person, who decides every item (origin
# R37). Do NOT have an LLM write or pre-fill them, and do not copy dossier output into them:
# they are the yardstick for the provision-level diff, so a model-written reference would grade
# the model against itself. The scenario has no impact assessment, so each item is anchored on
# provision text (quote the proposal and the final article in `ia_section`).
#
# Until a person has replaced every TODO, set `status: written` and filled in `written_by` and
# `written_on`, `womm evolve diffcheck` reports `not_available` and nothing is scored. The
# check is monitoring only: it is shown on the evolution page and copied into promotion
# records, and it never gates a promotion. The Improvement Planner never reads this file.
#
# Shape: a golden case (evals/golden/) with split `diff_check`. Expected impacts are the changes
# a good diff analysis must find between the two versions (actor x mechanism level, about 5-10
# items); important omissions are changes it must not leave out. provision_keys must be keys
# of the scenario:
#   ai_act/high_risk/provider_obligations, ai_act/innovation/sme_measures,
#   ai_act/penalties/penalties
