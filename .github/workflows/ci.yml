name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Tests never call real LLMs: the fake backend replays scripted outputs.
  LANGSMITH_TRACING: "false"

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: {POSTGRES_USER: womm, POSTGRES_PASSWORD: womm, POSTGRES_DB: womm}
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U womm" --health-interval 2s --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {version: "0.9.26"}
      - run: uv sync --frozen --python 3.13
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: web}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json}
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx tsc --noEmit -p e2e
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [python, web]
    services:
      postgres:
        image: postgres:17
        env: {POSTGRES_USER: womm, POSTGRES_PASSWORD: womm, POSTGRES_DB: womm}
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U womm" --health-interval 2s --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {version: "0.9.26"}
      - run: uv sync --frozen --python 3.13
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json}
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run e2e
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
